name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modèles PaddleOCR ONNX (RapidOCR)
        run: |
          set +e +o pipefail
          {
          echo "== arborescence SWHL/RapidOCR"
          curl -sS -m 60 "https://huggingface.co/api/models/SWHL/RapidOCR/tree/main?recursive=true" | python3 -c "
          import sys,json
          for f in json.load(sys.stdin):
            if f.get('type')=='file': print(f['path'], round(f['size']/1e6,2),'Mo')"
          echo; echo "== licence"; curl -sS -m 30 "https://huggingface.co/api/models/SWHL/RapidOCR" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print('gated=',d.get('gated'),'licence=',(d.get('cardData') or {}).get('license'))"
          } > /tmp/probe.txt 2>&1
          cd $GITHUB_WORKSPACE
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; git add probe.txt; git commit -m probe; git push origin probe-logs --force
