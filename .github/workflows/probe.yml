name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signatures LiteRT-LM (annulation, limite de sortie)
        run: |
          set +e +o pipefail
          {
          B=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/0.18.1
          curl -sS -m 120 -o /tmp/lm.aar $B/litertlm-android-0.18.1.aar
          mkdir -p /tmp/aar && cd /tmp/aar && unzip -oq /tmp/lm.aar
          for c in Conversation ConversationConfig EngineConfig Engine MessageCallback SamplerConfig; do
            echo "---- $c"; javap -public -cp classes.jar "com.google.ai.edge.litertlm.$c" 2>&1 | grep -vE "copy|component|hashCode|equals|\\\$default" | head -40
          done
          } > /tmp/probe.txt 2>&1
          cd $GITHUB_WORKSPACE
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; git add probe.txt; git commit -q -m probe; git push origin probe-logs --force
