name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonder Hugging Face et les dépôts Maven
        run: |
          set +e +o pipefail
          {
          echo "== modèles litert-community (qwen, gemma, phi, llama) =="
          for q in qwen gemma phi llama smol; do
            curl -sS -m 30 "https://huggingface.co/api/models?author=litert-community&search=$q&limit=30" | python3 -c "
          import sys,json
          for m in json.load(sys.stdin): print(m['id'], 'gated=',m.get('gated'), 'downloads=',m.get('downloads'))"
          done
          echo; echo "== fichiers et tailles =="
          for r in litert-community/Qwen2.5-1.5B-Instruct litert-community/Qwen2.5-3B-Instruct litert-community/Qwen3-0.6B litert-community/Gemma3-1B-IT litert-community/gemma-3n-E2B-it-litert-lm litert-community/Phi-4-mini-instruct Qwen/Qwen3-4B-GGUF Qwen/Qwen2.5-3B-Instruct-GGUF Qwen/Qwen3-1.7B-GGUF; do
            echo "-- $r"
            curl -sS -m 30 "https://huggingface.co/api/models/$r/tree/main" | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin)
            for f in d:
              if f.get('type')=='file' and f['size']>50_000_000: print('  ',f['path'], round(f['size']/1e9,2),'Go')
            if not isinstance(d,list): print(d)
          except Exception as e: print('  erreur',e)"
            curl -sS -m 30 "https://huggingface.co/api/models/$r" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print('   gated=',d.get('gated'),'licence=',d.get('cardData',{}).get('license') if d.get('cardData') else None)" 2>/dev/null
          done
          echo; echo "== Maven =="
          for u in com/google/mediapipe/tasks-genai com/google/ai/edge/litertlm; do
            printf "%s -> " $u; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://repo1.maven.org/maven2/$u/maven-metadata.xml
          done
          curl -sS -m 20 https://repo1.maven.org/maven2/com/google/mediapipe/tasks-genai/maven-metadata.xml | grep -E "<latest>|<release>"
          curl -sS -m 20 https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/group-index.xml | head -5
          } > /tmp/probe.txt 2>&1
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; git add probe.txt; git commit -m probe; git push origin probe-logs --force
