name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonder les modèles Gemma 4 LiteRT-LM
        run: |
          set +e +o pipefail
          {
          for r in litert-community/gemma-4-E2B-it-litert-lm litert-community/gemma-4-E4B-it-litert-lm; do
            echo "== $r"
            curl -sS -m 30 "https://huggingface.co/api/models/$r" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('gated=',d.get('gated'),'private=',d.get('private'),'licence=',(d.get('cardData') or {}).get('license'), 'tags=',[t for t in d.get('tags',[]) if t.startswith('license') or t in ('translation','multilingual')])
          for f in d.get('siblings',[]): print('  ',f['rfilename'])"
            curl -sS -m 30 "https://huggingface.co/api/models/$r/tree/main" | python3 -c "
          import sys,json
          for f in json.load(sys.stdin):
            if f.get('type')=='file': print('  taille', f['path'], round(f['size']/1e9,3),'Go', 'sha256=',(f.get('lfs') or {}).get('oid'))"
          done
          echo; echo "== en-tête de la fiche (extrait)"
          curl -sSL -m 30 "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/raw/main/README.md" | head -60
          echo; echo "== téléchargement sans compte : octets 0-1023"
          F=$(curl -sS -m 30 "https://huggingface.co/api/models/litert-community/gemma-4-E2B-it-litert-lm/tree/main" | python3 -c "
          import sys,json
          fs=[f['path'] for f in json.load(sys.stdin) if f['path'].endswith('.litertlm')]; print(fs[0] if fs else '')")
          echo "fichier: $F"
          curl -sSL -m 60 -r 0-1023 -o /tmp/head.bin -w "HTTP %{http_code} taille %{size_download} url_finale=%{url_effective}\n" "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/$F"
          } > /tmp/probe.txt 2>&1
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; git add probe.txt; git commit -m probe; git push origin probe-logs --force
