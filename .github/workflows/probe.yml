name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sondage Hugging Face (fichiers et tailles)
        run: python3 ci/probe_hf.py /tmp/hf.txt || true
      - name: Télécharger quelques modèles à tester en local
        run: |
          mkdir -p /tmp/models; cd /tmp/models
          H=https://huggingface.co
          for f in monkt/paddleocr-onnx/languages/english/rec.onnx monkt/paddleocr-onnx/languages/english/dict.txt monkt/paddleocr-onnx/languages/english/config.json \
                   monkt/paddleocr-onnx/languages/korean/rec.onnx monkt/paddleocr-onnx/languages/korean/dict.txt monkt/paddleocr-onnx/languages/latin/rec.onnx monkt/paddleocr-onnx/languages/latin/dict.txt \
                   monkt/paddleocr-onnx/detection/v3/det.onnx edgetools/migan/migan_pipeline_v2.onnx; do
            n=$(echo $f | sed 's#/#__#g'); curl -sSfL -m 300 -o "$n" "$H/${f%%/*}/$(echo $f | cut -d/ -f2)/resolve/main/$(echo $f | cut -d/ -f3-)" || echo "ECHEC $f"
          done
          ls -la /tmp/models
      - name: Signatures LiteRT-LM (annulation, limite de sortie)
        run: |
          set +e +o pipefail
          {
          B=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/0.18.1
          curl -sS -m 120 -o /tmp/lm.aar $B/litertlm-android-0.18.1.aar
          mkdir -p /tmp/aar && cd /tmp/aar && unzip -oq /tmp/lm.aar
          for c in Conversation ConversationConfig EngineConfig Engine MessageCallback SamplerConfig; do
            echo "---- $c"; javap -public -cp classes.jar "com.google.ai.edge.litertlm.$c" 2>&1 | grep -vE "copy|component|hashCode|equals|\\\$default" | head -40
          done
          } > /tmp/probe.txt 2>&1
          cd $GITHUB_WORKSPACE
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; cp /tmp/hf.txt hf.txt 2>/dev/null; cp /tmp/models/* . 2>/dev/null; git add -A; git commit -q -m probe; git push origin probe-logs --force
