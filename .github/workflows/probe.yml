name: Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Annotations et signatures détaillées de litertlm-android 0.19.1
        run: |
          set +e +o pipefail
          mkdir -p /tmp/out /tmp/v/aar /tmp/v/cls
          G=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android
          cd /tmp/v
          curl -sS -m 180 -o l.aar $G/0.19.1/litertlm-android-0.19.1.aar
          unzip -oq l.aar -d aar
          ( cd cls && unzip -oq ../aar/classes.jar )
          for c in ExperimentalFlags EngineConfig ConversationConfig SessionConfig Conversation Session SpeculativeDecodingMode SpeculativeDecodingConfig 'Backend$CPU'; do
            echo "######## $c"
            javap -v -p -cp cls "com.google.ai.edge.litertlm.$c" 2>&1 | grep -n -i -E "Deprecated|ExperimentalApi|message=|level=|replaceWith|^  [a-z].*\(.*\);|RuntimeVisibleAnnotations" | grep -v -E "access\\$|\\\$default|copy|component" | head -150
          done > /tmp/out/annotations-0.19.1.txt 2>&1
          wc -l /tmp/out/annotations-0.19.1.txt
          cd $GITHUB_WORKSPACE
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan probe-logs; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* . ; git add -A; git commit -q -m probe; git push origin probe-logs --force
