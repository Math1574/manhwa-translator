name: Banc de traduction
on:
  push:
    branches: ['tbench/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 ci/tbench/plan.py)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Modèle Gemma 4 E4B (cache)
        uses: actions/cache@v4
        with: { path: ~/model, key: gemma4-e4b-litertlm-1 }
      - name: Téléchargement du modèle (si absent du cache)
        run: |
          mkdir -p ~/model
          if [ ! -s ~/model/m.litertlm ]; then curl -sSfL --retry 3 -o ~/model/m.litertlm https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm; fi
          ls -la ~/model
      - name: LiteRT-LM (Python)
        run: pip install --quiet litert-lm-api==0.20.0
      - name: Compilateur Kotlin
        run: |
          curl -sSfL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.0/kotlin-compiler-2.4.0.zip
          unzip -q /tmp/kc.zip -d /tmp/kc
      - name: Compilation du cœur et du banc
        run: /tmp/kc/kotlinc/bin/kotlinc -jvm-target 17 -nowarn -d /tmp/bench.jar core/src/main/kotlin ci/tbench/TranslationBench.kt 2>&1 | grep -v '^warning' | head -40; ls -la /tmp/bench.jar
      - name: Données
        run: python3 ci/tbench/unpack.py ci/tbench/data.bin /tmp/data
      - name: Serveur du modèle
        run: |
          nohup python3 ci/tbench/server.py ~/model/m.litertlm 7070 > /tmp/server.log 2>&1 &
          ok=0; for i in $(seq 1 180); do if curl -sf http://127.0.0.1:7070/health >/dev/null; then ok=1; break; fi; sleep 5; done
          cat /tmp/server.log; nproc; free -g
          [ "$ok" = 1 ] || { echo "le serveur du modèle n'a pas démarré"; exit 1; }
      - name: Banc
        run: |
          mkdir -p /tmp/out
          java -cp /tmp/bench.jar:/tmp/kc/kotlinc/lib/kotlin-stdlib.jar app.manhwa.core.TranslationBenchKt /tmp/data/${{ matrix.shard }}.tsv /tmp/out/${{ matrix.variant }}__${{ matrix.shard }}.tsv http://127.0.0.1:7070/ app/src/main/assets/lexicon ${{ matrix.opts }}
      - name: Journal du serveur
        if: always()
        run: cp /tmp/server.log /tmp/out/${{ matrix.variant }}__${{ matrix.shard }}.server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.variant }}-${{ matrix.shard }}
          path: /tmp/out
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/res, merge-multiple: true }
      - name: Publication des résultats (branche tbench-res-N, emballés comme les entrées)
        run: |
          cp ci/tbench/pack.py /tmp/pack.py
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan tbench-res-${{ github.run_number }}
          git rm -rf . >/dev/null 2>&1 || true
          python3 /tmp/pack.py /tmp/res res.bin || echo "aucun résultat" > vide.txt
          git add -A; git commit -q -m "banc de traduction ${{ github.ref_name }} (run ${{ github.run_number }})"
          git push origin tbench-res-${{ github.run_number }} --force
