name: Build
on:
  push:
    paths-ignore: ['.github/workflows/probe.yml', '.github/workflows/mteval.yml', 'ci/probe_hf.py', 'ci/mteval.py']
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'quick (ML Kit), full (ajoute Gemma) ou lab (banc d essai de traduction)'
        default: 'quick'
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.suite || 'quick' }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :core:test --no-daemon
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "Script de garde du bloqueur (JavaScript), syntaxe et comportements dans un navigateur simulé"
        run: |
          cd tools/adblock
          npm init -y >/dev/null 2>&1
          npm install jsdom@24 --no-audit --no-fund --silent
          node guard_test.js
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Modèles OCR (PaddleOCR, Apache-2.0) dans les assets
        run: |
          mkdir -p app/src/main/assets/ocr
          H=https://huggingface.co/SWHL/RapidOCR/resolve/main
          for f in PP-OCRv4/ch_PP-OCRv4_det_infer.onnx PP-OCRv3/en_PP-OCRv3_rec_infer.onnx PP-OCRv1/japan_rec_crnn.onnx PP-OCRv1/korean_mobile_v2.0_rec_infer.onnx PP-OCRv4/ch_PP-OCRv4_rec_infer.onnx; do
            curl -sSfL --retry 3 -o app/src/main/assets/ocr/$(basename $f) $H/$f
          done
          # second lecteur anglais (PP-OCRv5, Apache-2.0) : concurrent du v3, on garde la lecture la plus sûre
          V5=https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/english
          curl -sSfL --retry 3 -o app/src/main/assets/ocr/en_PP-OCRv5_rec_infer.onnx $V5/rec.onnx
          curl -sSfL --retry 3 -o app/src/main/assets/ocr/en_v5_dict.txt $V5/dict.txt
          K5=https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/korean
          curl -sSfL --retry 3 -o app/src/main/assets/ocr/korean_PP-OCRv5_rec_infer.onnx $K5/rec.onnx
          curl -sSfL --retry 3 -o app/src/main/assets/ocr/ko_v5_dict.txt $K5/dict.txt
          # lecteur unifié PP-OCRv5 mobile (officiel Paddle, Apache-2.0) : japonais
          curl -sSfL --retry 3 -o app/src/main/assets/ocr/ppocrv5_unified_rec_infer.onnx https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx
          # japonais vertical : manga-ocr, voir l'étape suivante (module téléchargé à la demande, plus embarqué dans l'APK du téléphone)
          # détecteur de bulles et de texte de bande dessinée (RT-DETR, Apache-2.0, version quantifiée 11 Mo)
          mkdir -p app/src/main/assets/detector
          curl -sSfL --retry 3 -o app/src/main/assets/detector/detector-v4-s_int8.onnx https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector-v4-s_int8.onnx
          ls -la app/src/main/assets/ocr app/src/main/assets/detector
      - name: "Module japonais (manga-ocr, Apache-2.0), publié une fois en Release et repris de là ensuite"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p /tmp/ja-pack
          if gh release view models-ja-v1 >/dev/null 2>&1; then
            gh release download models-ja-v1 --dir /tmp/ja-pack --clobber
          else
            MO=https://huggingface.co/onnx-community/manga-ocr-base-ONNX/resolve/main/onnx
            curl -sSfL --retry 3 -o /tmp/ja-pack/manga_ocr_encoder_u8.onnx $MO/encoder_model_uint8.onnx
            curl -sSfL --retry 3 -o /tmp/ja-pack/manga_ocr_decoder_u8.onnx $MO/decoder_model_uint8.onnx
            curl -sSfL --retry 3 -o /tmp/ja-pack/manga_ocr_vocab.txt https://huggingface.co/kha-white/manga-ocr-base/resolve/main/vocab.txt
            BASE="https://github.com/${{ github.repository }}/releases/download/models-ja-v1"
            ( cd /tmp/ja-pack
              echo "# nom taille sha256 adresse (écrit par la compilation en ligne)" > ja.txt
              for f in manga_ocr_encoder_u8.onnx manga_ocr_decoder_u8.onnx manga_ocr_vocab.txt; do
                echo "$f $(stat -c %s "$f") $(sha256sum "$f" | cut -d' ' -f1) $BASE/$f" >> ja.txt
              done )
            gh release create models-ja-v1 /tmp/ja-pack/manga_ocr_encoder_u8.onnx /tmp/ja-pack/manga_ocr_decoder_u8.onnx /tmp/ja-pack/manga_ocr_vocab.txt /tmp/ja-pack/ja.txt \
              --title "Module japonais (manga-ocr)" --notes "Modèles du lecteur de japonais vertical, téléchargés par l'application à la demande (Réglages, Modèles). Ne pas supprimer."
          fi
          cat /tmp/ja-pack/ja.txt
          # contrôle : chaque fichier correspond à son manifeste
          grep -v '^#' /tmp/ja-pack/ja.txt | while read -r name size sha url; do
            [ "$(stat -c %s "/tmp/ja-pack/$name")" = "$size" ] && [ "$(sha256sum "/tmp/ja-pack/$name" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::$name ne correspond pas à son manifeste"; exit 1; }
          done
      - name: Clé de signature fixe (brouillon privé du dépôt)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          set -euo pipefail
          REL=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == true and (.name | startswith("Cle de signature")))][0].id')
          if [ -z "$REL" ] || [ "$REL" = "null" ]; then echo "::error::Clé de signature introuvable : lancer une fois le workflow « Cle de signature »."; exit 1; fi
          for f in release.p12 release.pass; do
            id=$(gh api "repos/${{ github.repository }}/releases/$REL/assets" --jq ".[] | select(.name == \"$f\") | .id")
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$id" > "$RUNNER_TEMP/$f"
          done
          PASS=$(cat "$RUNNER_TEMP/release.pass"); echo "::add-mask::$PASS"
          { echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12"; echo "SIGNING_STORE_PASSWORD=$PASS"; echo "SIGNING_KEY_PASSWORD=$PASS"; echo "SIGNING_KEY_ALIAS=manhwa"; } >> "$GITHUB_ENV"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$PASS" 2>/dev/null | grep -E "manhwa|Certificate fingerprint" | sed 's/^/clé : /' | head -3 || true
      - name: Compiler l'APK de test pour l'émulateur (x86_64, avec le lecteur de japonais intégré)
        run: |
          set -o pipefail
          mkdir -p app/src/main/assets/packs
          cp /tmp/ja-pack/ja.txt app/src/main/assets/packs/ja.txt
          cp /tmp/ja-pack/manga_ocr_* app/src/main/assets/ocr/
          gradle :app:assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} -Pabis=x86_64 2>&1 | tee /tmp/apk.log
          mkdir -p apk-e2e && cp app/build/outputs/apk/debug/app-debug.apk apk-e2e/app-debug.apk
      - name: Compiler l'APK du téléphone (arm64 seul, lecteur de japonais en module à part)
        run: |
          set -o pipefail
          rm -f app/src/main/assets/ocr/manga_ocr_*
          gradle :app:assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} -Pabis=arm64-v8a 2>&1 | tee -a /tmp/apk.log
          cp app/build/outputs/apk/debug/app-debug.apk ManhwaTranslator-debug.apk
          ls -la ManhwaTranslator-debug.apk apk-e2e/app-debug.apk
          # signature : l'empreinte du certificat doit être celle de la clé fixe (même valeur à chaque build)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs ManhwaTranslator-debug.apk | grep -E "Signer #1 certificate SHA-256|Verifies" | tee /tmp/cert.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaTranslator-debug-apk
          path: apk-e2e/app-debug.apk
      - name: Publier l'APK dans les Releases
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # les nouveautés montrées dans l'application sont le message de la modification (sans les mentions techniques de fin)
          git log -1 --pretty=%B | grep -v -i -E '^(Co-Authored-By|Claude-Session|Signed-off-by):|^🤖' > /tmp/notes.txt || true
          [ -s /tmp/notes.txt ] || echo "Build ${{ github.run_number }}" > /tmp/notes.txt
          gh release create "build-${{ github.run_number }}" ManhwaTranslator-debug.apk --title "Build ${{ github.run_number }}" --notes-file /tmp/notes.txt
      - name: Publier le journal (branche ci-logs)
        if: always()
        run: |
          cp /tmp/apk.log /tmp/apk-full.log || true
          grep -E "^e: |^w: .*\.kt|error:|FAILED|What went wrong|Execution failed|Could not|BUILD " /tmp/apk-full.log | head -150 > /tmp/apk-errors.log || true
          ls -la app/build/outputs/apk/debug/ >> /tmp/apk-errors.log 2>&1 || true
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git fetch origin ci-logs:ci-logs 2>/dev/null && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/apk-errors.log apk-errors.log; tail -200 /tmp/apk-full.log > apk-tail.log
          git add apk-errors.log apk-tail.log
          git commit -m "journal ${GITHUB_SHA}" || true
          git push origin ci-logs --force
  e2e:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUITE: ${{ github.event.inputs.suite || 'quick' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ManhwaTranslator-debug-apk, path: apk }
      - name: Outils de test (polices, ImageMagick, Pillow)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-comic-neue imagemagick python3-pil
      - name: Corpus du banc d'essai de traduction
        run: python3 -c "import json;d=json.load(open('ci/lab/corpus.json'));json.dump({'pages':d['pages']},open('ci/lab/lab.json','w'),ensure_ascii=False)"
      - name: Préparer le faux site de lecture
        run: |
          mkdir -p /tmp/site /tmp/e2e
          bash ci/fixtures/fetch_pc.sh /tmp/site/pc | tail -5
          python3 ci/fixtures/gen_synthetic.py /tmp/site/synth
          python3 ci/fixtures/gen_layouts.py /tmp/site/synth
          python3 ci/fixtures/gen_atypical.py /tmp/site/synth
          python3 ci/fixtures/gen_seams.py /tmp/site/synth
          python3 ci/fixtures/make_site.py /tmp/site
          mkdir -p /tmp/site/ref && ln -sfn /tmp/site/pc/en /tmp/site/ref/en
          nohup python3 ci/fixtures/server.py /tmp/site 8000 > /tmp/server.log 2>&1 &
          sleep 2; curl -sS -o /dev/null -w "site: HTTP %{http_code}\n" http://127.0.0.1:8000/index.html
      - name: Modèle Gemma (cache)
        if: env.SUITE != 'quick'
        uses: actions/cache@v4
        with: { path: /tmp/gemma, key: gemma-e2b-e4b-v1 }
      - name: Télécharger Gemma E2B si absent du cache
        if: env.SUITE != 'quick'
        run: |
          mkdir -p /tmp/gemma
          [ -f /tmp/gemma/gemma-4-E2B-it.litertlm ] || curl -sSfL -o /tmp/gemma/gemma-4-E2B-it.litertlm https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
          [ -f /tmp/gemma/gemma-4-E4B-it.litertlm ] || curl -sSfL -o /tmp/gemma/gemma-4-E4B-it.litertlm https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm
          sha256sum /tmp/gemma/*.litertlm
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 8192M
          heap-size: 1024M
          disk-size: 14G
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/e2e.sh
      - name: Analyse
        if: always()
        run: |
          python3 ci/analyze.py /tmp/e2e /tmp/site/synth || true
          python3 ci/lab/score.py /tmp/e2e ci/lab/corpus.json || true
      - name: Publier les résultats (branche e2e-quick ou e2e-full)
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp -r /tmp/e2e/. /tmp/pub/ || true
          cp /tmp/server.log /tmp/pub/server.log || true
          mkdir -p /tmp/pub/synth && cp /tmp/site/synth/* /tmp/pub/synth/ || true
          echo "${GITHUB_SHA} suite=${SUITE}" > /tmp/pub/COMMIT.txt
          cd /tmp/pub && git init -q -b e2e-${SUITE} && git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -q -m "e2e ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-${SUITE}
