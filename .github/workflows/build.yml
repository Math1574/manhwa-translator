name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :core:test --no-daemon
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Compiler l'APK debug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/apk.log
      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaTranslator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publier l'APK dans les Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ManhwaTranslator-debug.apk
          gh release create "build-${{ github.run_number }}" ManhwaTranslator-debug.apk --title "Build ${{ github.run_number }} (debug)" --notes "APK debug, commit ${GITHUB_SHA}. Voir docs/STATUS.md pour les limites connues."
      - name: Publier le journal (branche ci-logs)
        if: always()
        run: |
          cp /tmp/apk.log /tmp/apk-full.log || true
          grep -E "^e: |^w: .*\.kt|error:|FAILED|What went wrong|Execution failed|Could not|BUILD " /tmp/apk-full.log | head -150 > /tmp/apk-errors.log || true
          ls -la app/build/outputs/apk/debug/ >> /tmp/apk-errors.log 2>&1 || true
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git fetch origin ci-logs:ci-logs 2>/dev/null && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/apk-errors.log apk-errors.log; tail -200 /tmp/apk-full.log > apk-tail.log
          git add apk-errors.log apk-tail.log
          git commit -m "journal ${GITHUB_SHA}" || true
          git push origin ci-logs --force
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ManhwaTranslator-debug-apk, path: apk }
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ci/smoke.sh
      - name: Publier le rapport (branche ci-logs)
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.invalid"
          mkdir -p /tmp/keep && cp -r /tmp/smoke/. /tmp/keep/ || true
          git fetch origin ci-logs:ci-logs && git checkout ci-logs
          rm -rf smoke && mkdir smoke && cp -r /tmp/keep/. smoke/ || true
          git add smoke && git commit -m "smoke ${GITHUB_SHA}" || true
          git push origin ci-logs
