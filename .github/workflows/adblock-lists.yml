name: Listes de filtres
# Réassemble chaque semaine les listes du bloqueur de publicités (uBlock Origin, EasyList, HaGeZi) et publie le fichier si quelque chose a changé :
# l'application le télécharge pour se mettre à jour sans nouvelle version.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/adblock/build_lists.py
      - name: Publier si les listes ont changé
        run: |
          if [ -n "$(git status --porcelain app/src/main/assets/adblock/filters.txt)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/assets/adblock/filters.txt
            git commit -m "Listes de filtres du bloqueur mises à jour [skip ci]"
            git push
          else
            echo "Aucun changement"
          fi
