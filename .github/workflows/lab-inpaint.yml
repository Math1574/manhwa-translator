name: lab-inpaint
on:
  push:
    branches: [lab-inpaint]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances
        run: pip install onnxruntime huggingface_hub pillow numpy
      - name: Essai
        run: python lab/inpaint/run.py lab/inpaint/pairs /tmp/out
      - name: Résultats (branche lab-inpaint-out)
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          git init -q
          git config user.name "lab"
          git config user.email "lab@users.noreply.github.com"
          git checkout -q -b lab-inpaint-out
          git add -A
          git commit -qm "résultats lab-inpaint ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" lab-inpaint-out
